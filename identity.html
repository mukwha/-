 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨花</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #260508;
    color: #d0cecc;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        "바탕체",
        serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    padding: 50px 20px;

    overflow-x: hidden;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 560px;
    min-height: 780px;
    background: #1b1b1a;
    border: 1px solid #451014;
    padding: 75px 55px 45px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75);

    animation:
        cardAppear 1.5s ease forwards;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.title {
    margin: 0 0 55px;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        serif;

    font-size: 86px;
    font-weight: 400;
    letter-spacing: 10px;
    color: #e2dfdd;

    opacity: 0;

    animation:
        fadeIn 1.5s ease forwards;

    animation-delay: 0.4s;
}

.description {
    width: 100%;
    text-align: center;

    line-height: 2.1;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        serif;

    font-size: 15px;
    color: #999795;

    margin-bottom: 55px;

    opacity: 0;

    animation:
        fadeIn 1.5s ease forwards;

    animation-delay: 0.9s;
}

.description strong {
    display: block;

    font-size: 18px;
    font-weight: 400;

    color: #aaa8a6;

    margin-bottom: 14px;
}

.menu {
    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 14px;

    opacity: 0;

    animation:
        fadeUp 1.5s ease forwards;

    animation-delay: 1.5s;
}

.menu a {
    display: flex;

    align-items: center;
    justify-content: center;

    height: 72px;

    background: #242423;
    border: 1px solid #541116;

    color: #aaa7a5;

    text-decoration: none;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        serif;

    font-size: 14px;
    letter-spacing: 3px;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
}

.menu a:hover {
    background: #35080b;
    border-color: #75151b;
    color: #ddd9d7;
}

.quote {
    margin-top: 60px;

    color: #8f1d24;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        serif;

    font-size: 18px;
    letter-spacing: 3px;
    text-align: center;

    opacity: 0;

    animation:
        fadeIn 1.5s ease forwards;

    animation-delay: 2.1s;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .container {
        min-height: 720px;
        padding: 55px 28px 35px;
    }

    .title {
        font-size: 62px;
        letter-spacing: 7px;
        margin-bottom: 45px;
    }

    .description {
        font-size: 13px;
        margin-bottom: 45px;
        line-height: 2;
    }

    .description strong {
        font-size: 16px;
    }

    .menu {
        gap: 10px;
    }

    .menu a {
        height: 62px;
        font-size: 12px;
        letter-spacing: 2px;
    }

    .quote {
        margin-top: 45px;
        font-size: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {

    .container,
    .title,
    .description,
    .menu,
    .quote {
        animation: none !important;
        opacity: 1 !important;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        墨花
    </h1>

    <div class="description">

        <strong>
            먹으로 그린 꽃.
        </strong>

        한 번 새겨진 흔적은 쉽게 지워지지 않는다.<br>

        검은 흔적 위에 피어난 꽃은<br>

        그 누구도 쉽게 지울 수 없는 이름이 된다.

    </div>

    <nav class="menu">

        <a href="organization.html">
            조직 개요
        </a>

        <a href="hierarchy.html">
            내부 계층
        </a>

        <a href="identity.html">
            대외적 신분
        </a>

        <a href="records.html">
            기록 및 정보
        </a>

    </nav>

    <div class="quote">
        「墨落成花，闇覆其身。」
    </div>

</div>

</body>
</html>
