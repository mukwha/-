<title>墨花</title>

<style>

* {

}

html, body {

}

body {

    padding: 50px 20px;
}


/* 중앙 카드 */

.container {
    width: 100%;
    max-width: 560px;
    min-height: 780px;

    background: #171619;

    border: 1px solid #4b1825;

    text-align: center;

    line-height: 2;

    font-size: 14px;

}

.description strong {

    font-size: 18px;
    font-weight: 400;

    color: #d5cecc;

    margin-bottom: 14px;
}


/* 버튼 */

.menu {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.menu a {
    display: flex;

    align-items: center;

    color: #c9c1bf;

    text-decoration: none;

    letter-spacing: 3px;

    transition: 0.25s;

.menu a:hover {
    background: #3b0a15;

    border-color: #702238;

    color: #eee8e6;
}

.quote {

    letter-spacing: 2px;

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .container {
        min-height: 720px;

        padding: 55px 28px 35px;
    }

    .title {
        font-size: 62px;

        letter-spacing: 8px;

        margin-bottom: 45px;
    }

    .description {
        font-size: 13px;

        margin-bottom: 45px;
    }
