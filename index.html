<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨花 — MOKHWA</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #5b0718;
    color: #e8e2df;
    font-family: "Times New Roman", "Noto Serif KR", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    padding: 50px 20px;
}

/* 중앙 카드 */

.container {
    width: 100%;
    max-width: 560px;
    min-height: 780px;

    background: #080708;

    border: 1px solid #3d1a21;

    padding: 75px 55px 45px;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        0 25px 80px rgba(0,0,0,0.55);
}

/* 제목 */

.title {
    font-size: 86px;
    font-weight: 400;
    letter-spacing: 12px;

    margin: 0 0 12px;

    color: #f0e9e7;
}

.subtitle {
    font-size: 12px;
    letter-spacing: 6px;

    color: #8d8584;

    margin-bottom: 55px;
}

/* 설명 */

.description {
    width: 100%;

    text-align: center;

    line-height: 2;

    font-size: 14px;

    color: #b9b1af;

    margin-bottom: 55px;
}

.description strong {
    display: block;

    font-size: 17px;

    color: #ded7d4;

    font-weight: 400;

    margin-bottom: 12px;
}

/* 버튼 */

.menu {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.menu a {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 62px;

    border: 1px solid #49202a;

    background: #130d0f;

    color: #d9d1cf;

    text-decoration: none;

    font-size: 14px;
    letter-spacing: 4px;

    transition: 0.25s;
}

.menu a:hover {
    background: #5b0718;
    border-color: #78162c;
    color: white;
}

/* 인용문 */

.quote {
    margin-top: 60px;

    color: #8e2338;

    font-size: 13px;

    letter-spacing: 2px;

    text-align: center;
}

/* 하단 */

.footer {
    margin-top: auto;
    padding-top: 55px;

    font-size: 9px;

    letter-spacing: 7px;

    color: #4e4848;
}


/* 모바일 */

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .container {
        min-height: 720px;

        padding: 55px 28px 35px;
    }

    .title {
        font-size: 62px;
        letter-spacing: 8px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 4px;

        margin-bottom: 45px;
    }

    .description {
        font-size: 13px;

        margin-bottom: 45px;
    }

    .description strong {
        font-size: 16px;
    }

    .menu a {
        height: 58px;

        font-size: 12px;
        letter-spacing: 3px;
    }

    .quote {
        margin-top: 45px;
        font-size: 11px;
    }

}

</style>
</head>


<body>

<div class="container">

    <h1 class="title">墨花</h1>

    <div class="subtitle">
        M O K H W A
    </div>


    <div class="description">

        <strong>먹으로 그린 꽃.</strong>

        한 번 새겨진 흔적은 쉽게 지워지지 않는다.<br>
        검은 흔적 위에 피어난 꽃은<br>
        그 누구도 쉽게 지울 수 없는 이름이 된다.

    </div>


    <nav class="menu">

        <a href="organization.html">
            조직 개요
        </a>

        <a href="hierarchy.html">
            내부 계층
        </a>

        <a href="identity.html">
            대외 신분
        </a>

        <a href="records.html">
            기록 및 정보
        </a>

    </nav>


    <div class="quote">
        「墨落成花，闇覆其身。」
    </div>


    <div class="footer">
        M O K H W A
    </div>

</div>

</body>
</html>
