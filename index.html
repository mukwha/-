 <!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨花</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    margin: 0;

    background: #260508;

    color: #d0cecc;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        "바탕체",
        serif;

    padding: 45px 20px;

    overflow-x: hidden;
}


/* 전체 페이지 */

.page {
    width: 100%;

    max-width: 760px;

    margin: 0 auto;

    background: #1b1b1a;

    border: 1px solid #451014;

    padding: 65px;

    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75);

    animation:
        pageAppear 1.4s ease forwards;
}


/* 표지 */

.cover {
    min-height: 700px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


/* 상단 */

.logo-small {
    color: #8f1d24;

    font-size: 12px;

    letter-spacing: 5px;

    margin-bottom: 35px;

    opacity: 0;

    animation:
        fadeIn 1.2s ease forwards;

    animation-delay: 0.3s;
}


/* 메인 로고 */

.logo {
    margin: 0;

    color: #e2dfdd;

    font-size: 76px;

    font-weight: 400;

    letter-spacing: 18px;

    line-height: 1;

    margin-left: 18px;

    opacity: 0;

    animation:
        fadeUp 1.5s ease forwards;

    animation-delay: 0.5s;
}


/* 한글 */

.logo-korean {
    margin-top: 25px;

    color: #777574;

    font-size: 15px;

    letter-spacing: 7px;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 0.9s;
}


/* 설명 */

.description {
    margin-top: 65px;

    color: #999795;

    font-size: 13px;

    line-height: 2.2;

    letter-spacing: 1px;

    opacity: 0;

    animation:
        fadeUp 1.4s ease forwards;

    animation-delay: 1.1s;
}


/* 인용문 */

.quote {
    margin-top: 55px;

    padding-top: 30px;

    border-top: 1px solid #541116;

    color: #d6d2d0;

    font-size: 14px;

    letter-spacing: 3px;

    opacity: 0;

    animation:
        fadeIn 1.4s ease forwards;

    animation-delay: 1.4s;
}


/* 메뉴 */

.menu {
    width: 100%;

    max-width: 560px;

    margin-top: 60px;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 12px;

    opacity: 0;

    animation:
        fadeUp 1.4s ease forwards;

    animation-delay: 1.7s;
}


.menu a {
    display: flex;

    align-items: center;

    justify-content: center;

    height: 72px;

    background: #242423;

    border: 1px solid #541116;

    color: #aaa7a5;

    text-decoration: none;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        "바탕체",
        serif;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 3px;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
}


.menu a:hover {
    background: #351013;

    border-color: #8f1d24;

    color: #e2dfdd;
}


/* 하단 */

.footer {
    width: 100%;

    margin-top: 55px;

    padding-top: 25px;

    border-top: 1px solid #353433;

    display: flex;

    justify-content: center;

    align-items: center;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 2.1s;
}


.mark {
    color: #5f0c12;

    font-size: 13px;

    letter-spacing: 4px;
}


/* 애니메이션 */

@keyframes pageAppear {

    from {
        opacity: 0;

        transform: translateY(15px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes fadeUp {

    from {
        opacity: 0;

        transform: translateY(15px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


/* 모바일 */

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }


    .page {
        padding: 40px 25px;
    }


    .cover {
        min-height: 650px;
    }


    .logo {
        font-size: 58px;

        letter-spacing: 12px;

        margin-left: 12px;
    }


    .logo-korean {
        font-size: 13px;

        letter-spacing: 5px;
    }


    .description {
        font-size: 12px;

        line-height: 2;
    }


    .quote {
        font-size: 12px;

        letter-spacing: 2px;
    }


    .menu {
        grid-template-columns: 1fr;
    }


    .menu a {
        height: 65px;
    }

}


/* 모션 줄이기 */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before {
        animation: none !important;

        opacity: 1 !important;
    }

}

</style>

</head>


<body>

<main class="page">

<section class="cover">


    <div class="logo-small">
        ORGANIZATION FILE
    </div>


    <h1 class="logo">
        墨花
    </h1>


    <div class="logo-korean">
        묵화
    </div>


    <div class="description">

        러시아를 주요 거점으로 삼는 대형 범죄 조직.
        <br>
        모습을 드러내지 않은 채 오랜 시간 세력을 확장해 왔다.

        <br><br>

        영혼까지도 묵화의 것이 된다.

    </div>


    <div class="quote">
        기록되지 않은 것은, 존재하지 않는 것과 같다.
    </div>


    <nav class="menu">

        <a href="organization.html">
            조직 개요
        </a>

        <a href="hierarchy.html">
            내부 계층
        </a>

        <a href="outside.html">
            대외 신분
        </a>

        <a href="record.html">
            기록 및 정보
        </a>

    </nav>


    <footer class="footer">

        <span class="mark">
            墨花
        </span>

    </footer>


</section>

</main>

</body>

</html>
