<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨花</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at center,
          #241116 0%,
          #120b0e 45%,
          #080809 100%
        );
      color: #d8d1d2;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 16px;
    }

    /* 중앙 세로형 카드 */
    .card {
      width: min(92vw, 560px);
      min-height: min(88vh, 850px);

      background:
        linear-gradient(
          135deg,
          rgba(17, 16, 19, 0.98),
          rgba(35, 12, 18, 0.98)
        );

      border: 1px solid rgba(100, 35, 45, 0.16);

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 110px 55px 75px;

      box-shadow:
        0 0 80px rgba(45, 8, 18, 0.35);

      position: relative;
      overflow: hidden;
    }

    /* 카드 안쪽의 은은한 버건디 */
    .card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 500px;
      top: -100px;
      right: -130px;

      background: rgba(83, 20, 31, 0.16);
      filter: blur(80px);
      transform: rotate(25deg);
    }

    .content {
      width: 100%;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* 제목 */
    .title {
      font-size: clamp(52px, 9vw, 76px);
      font-weight: 500;
      letter-spacing: 14px;
      margin-left: 14px;
      color: #bbb3b5;
    }

    .description {
      margin-top: 25px;
      color: #9d9698;
      line-height: 1.8;
      font-size: clamp(13px, 2vw, 16px);
      font-weight: 500;
    }

    .description span {
      display: block;
    }

    /* 메뉴 */
    .menu {
      width: 100%;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu a {
      width: 100%;
      min-height: 62px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(57, 14, 21, 0.72);
      color: #d5ced0;

      text-decoration: none;
      font-size: 17px;
      font-weight: 600;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }

    .menu a:hover {
      background: rgba(91, 23, 34, 0.85);
      color: #eee9ea;
      transform: translateY(-2px);
    }

    /* 하단 문구 */
    .quote {
      margin-top: 32px;
      color: #7d1b29;
      font-family: "Noto Serif KR", serif;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 60px;
      color: #4d4447;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
    }

    /* 휴대폰 */
    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .card {
        width: 100%;
        min-height: 100vh;
        border: none;
        padding: 125px 48px 70px;
      }

      .title {
        font-size: 55px;
      }

      .description {
        font-size: 14px;
      }

      .menu a {
        min-height: 62px;
        font-size: 16px;
      }
    }

    /* 아주 작은 휴대폰 */
    @media (max-width: 380px) {
      .card {
        padding-left: 32px;
        padding-right: 32px;
      }

      .title {
        font-size: 48px;
        letter-spacing: 10px;
        margin-left: 10px;
      }

      .description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="content">

      <div class="title">墨花</div>

      <div class="description">
        <span>먹으로 그린 꽃.</span>
        <span>한 번 새겨진 흔적은 쉽게 지워지지 않는다.</span>
      </div>

      <nav class="menu">

        <a href="#">조직 개요</a>

        <a href="#">내부 계층</a>

        <a href="#">대외 신분</a>

        <a href="#">정보 통제</a>

      </nav>

      <div class="quote">
        「墨落成花，闇覆其身。」
      </div>

      <div class="footer">
        M O K H W A
      </div>

    </div>

  </div>

</body>
</html>
