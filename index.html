 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨花</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #260508;
    color: #d0cecc;

    font-family:
        "Noto Serif KR",
        serif;

    font-weight: 500;

    padding: 45px 20px;

    overflow-x: hidden;
}


/* =========================
   PAGE
========================= */

.page {
    width: 100%;
    max-width: 760px;

    margin: 0 auto;

    background: #1b1b1a;

    border: 1px solid #451014;

    padding: 65px;

    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75);

    animation:
        pageAppear 1.4s ease forwards;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;

    padding-bottom: 42px;

    border-bottom: 1px solid #451014;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 0.2s;
}


.logo {
    color: #8f1d24;

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 7px;

    margin-bottom: 22px;
}


.title {
    margin: 0;

    color: #e2dfdd;

    font-size: 62px;

    font-weight: 700;

    letter-spacing: 12px;

    line-height: 1.2;
}


.subtitle {
    margin-top: 18px;

    color: #777574;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 4px;
}


/* =========================
   DESCRIPTION
========================= */

.description {
    margin: 48px auto;

    max-width: 540px;

    text-align: center;

    color: #999795;

    font-size: 14px;

    font-weight: 500;

    line-height: 2.2;

    opacity: 0;

    animation:
        fadeUp 1.3s ease forwards;

    animation-delay: 0.6s;
}


.description strong {
    color: #c4c1bf;

    font-weight: 700;
}


/* =========================
   MENU
========================= */

.menu {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    opacity: 0;

    animation:
        fadeUp 1.3s ease forwards;

    animation-delay: 1s;
}


.menu a {
    display: flex;

    align-items: center;

    justify-content: center;

    height: 72px;

    background: #242423;

    border: 1px solid #541116;

    color: #aaa7a5;

    text-decoration: none;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        serif;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 3px;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
}


.menu a:hover {
    background: #301013;

    border-color: #8f1d24;

    color: #e2dfdd;
}


/* =========================
   QUOTE
========================= */

.quote {
    margin-top: 52px;

    padding-top: 30px;

    border-top: 1px solid #353433;

    text-align: center;

    color: #5f0c12;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 3px;

    line-height: 2;

    opacity: 0;

    animation:
        fadeIn 1.5s ease forwards;

    animation-delay: 1.5s;
}


/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 38px;

    padding-top: 20px;

    border-top: 1px solid #353433;

    text-align: center;

    color: #4f4d4b;

    font-size: 11px;

    font-weight: 500;

    letter-spacing: 3px;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 1.8s;
}


/* =========================
   ANIMATION
========================= */

@keyframes pageAppear {

    from {
        opacity: 0;

        transform: translateY(15px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes fadeUp {

    from {
        opacity: 0;

        transform: translateY(15px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .page {
        padding: 45px 28px 50px;
    }

    .title {
        font-size: 46px;

        letter-spacing: 8px;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .menu a {
        height: 64px;
    }

    .description {
        font-size: 13px;
    }

    .quote {
        font-size: 12px;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before {
        animation: none !important;

        opacity: 1 !important;
    }

}

</style>
</head>


<body>

<main class="page">


    <header class="header">

        <div class="logo">
            墨花
        </div>

        <h1 class="title">
            墨花
        </h1>

        <div class="subtitle">
            기록되지 않은 이름
        </div>

    </header>


    <div class="description">

        러시아를 주요 거점으로 삼는 대형 범죄 조직.<br>
        모습을 드러내지 않은 채 오랜 시간 세력을 확장해 왔다.<br><br>

        <strong>
            영혼까지도 묵화의 것이 된다.
        </strong>

    </div>


    <nav class="menu">

        <a href="organization.html">
            조직 개요
        </a>

        <a href="hierarchy.html">
            내부 계층
        </a>

        <a href="identity.html">
            대외 신분
        </a>

        <a href="records.html">
            기록 및 정보
        </a>

    </nav>


    <div class="quote">

        기록되지 않은 것은,
        존재하지 않는 것과 같다.

    </div>


    <footer class="footer">

        墨花

    </footer>


</main>

</body>
</html>
