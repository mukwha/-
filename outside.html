 <!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨花 — 대외 신분</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #260508;
    color: #d0cecc;

    font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        "함초롬바탕",
        "바탕체",
        serif;

    padding: 45px 20px;

    overflow-x: hidden;
}


/* 전체 페이지 */

.page {
    width: 100%;
    max-width: 760px;

    margin: 0 auto;

    background: #1b1b1a;

    border: 1px solid #451014;

    padding: 65px 65px 60px;

    box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.75);

    animation:
        pageAppear 1.4s ease forwards;
}


/* 상단 */

.header {
    border-bottom: 1px solid #451014;

    padding-bottom: 32px;

    margin-bottom: 45px;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 0.2s;
}

.number {
    color: #8f1d24;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 17px;
}

.title {
    margin: 0;

    font-size: 48px;

    font-weight: 400;

    letter-spacing: 8px;

    color: #e2dfdd;
}

.subtitle {
    margin-top: 15px;

    color: #777574;

    font-size: 13px;

    letter-spacing: 2px;
}


/* 본문 */

.content {
    opacity: 0;

    animation:
        fadeUp 1.4s ease forwards;

    animation-delay: 0.5s;
}

.content p {
    margin: 0;

    color: #999795;

    font-size: 14px;

    line-height: 2.15;

    letter-spacing: 0.2px;
}


/* 마지막 문장 */

.final-line {
    margin-top: 38px;

    padding-top: 28px;

    border-top: 1px solid #541116;

    color: #d6d2d0;

    font-size: 15px;

    line-height: 2;

    letter-spacing: 2px;
}


/* 기록되지 않은 말 */

.secret {
    margin-top: 55px;

    padding: 30px 32px;

    background: #20201f;

    border: 1px solid #453536;

    opacity: 0;

    animation:
        fadeUp 1.3s ease forwards;

    animation-delay: 1.2s;
}

.secret-title {
    color: #8f1d24;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 18px;
}

.secret-subtitle {
    color: #d6d2d0;

    font-size: 17px;

    letter-spacing: 3px;

    margin-bottom: 18px;
}

.secret-text {
    color: #777574;

    font-size: 12px;

    line-height: 2.1;

    letter-spacing: 0.5px;
}


/* 하단 */

.footer {
    margin-top: 45px;

    padding-top: 25px;

    border-top: 1px solid #353433;

    display: flex;

    justify-content: space-between;

    align-items: center;

    opacity: 0;

    animation:
        fadeIn 1.3s ease forwards;

    animation-delay: 1.8s;
}

.back {
    color: #777574;

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 2px;

    transition:
        color 0.3s ease;
}

.back:hover {
    color: #b32a32;
}

.mark {
    color: #5f0c12;

    font-size: 13px;

    letter-spacing: 3px;
}


/* 애니메이션 */

@keyframes pageAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* 모바일 */

@media (max-width: 600px) {

    body {
        padding: 20px 12px;
    }

    .page {
        padding: 45px 28px 50px;
    }

    .title {
        font-size: 36px;

        letter-spacing: 6px;
    }

    .content p {
        font-size: 13px;

        line-height: 2;
    }

    .final-line {
        font-size: 14px;
    }

    .secret {
        padding: 26px 23px;
    }

    .secret-subtitle {
        font-size: 15px;
    }

    .secret-text {
        font-size: 11px;
    }

}


/* 모션 줄이기 */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before {
        animation: none !important;

        opacity: 1 !important;
    }

}

</style>

</head>


<body>

<main class="page">


    <header class="header">

        <div class="number">
            기록 03
        </div>

        <h1 class="title">
            대외 신분
        </h1>

        <div class="subtitle">
            조직이 세상에 드러내는 얼굴
        </div>

    </header>


    <section class="content">

        <p>

            공식적으로는 러시아에 본사를 둔 생명과학 기업으로 존재한다.

            <br><br>

            신약 개발과 의약품 연구를 주요 사업으로 내세우며,
            대외적으로는 정상적인 기업의 모습을 유지한다.

            <br><br>

            조직과 기업의 관계를 의심할 만한 흔적은
            철저하게 분리되어 있다.

        </p>


        <div class="final-line">

            그들은 언제나, 가장 평범한 얼굴로 존재한다.

        </div>

    </section>


    <section class="secret">

        <div class="secret-title">
            기록되지 않은 말
        </div>

        <div class="secret-subtitle">
            보이지 않는 얼굴
        </div>

        <div class="secret-text">

            공식적인 기록에는 남지 않는다.
            <br>
            알려져서는 안 되는 것들은 언제나
            기록보다 먼저 지워진다.

        </div>

    </section>


    <footer class="footer">

        <a class="back" href="index.html">
            ← 메인으로
        </a>

        <span class="mark">
            墨花
        </span>

    </footer>


</main>

</body>

</html>
